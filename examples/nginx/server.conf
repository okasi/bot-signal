# Include this file inside nginx.conf's http block.
# Requires ngx_http_auth_request_module (nginx -V).
server {
    listen 127.0.0.1:8080;
    server_name localhost;

    location / {
        auth_request /_bot_signal;
        auth_request_set $bot_signal_score $upstream_http_x_bot_signal_score;
        auth_request_set $bot_signal_decision $upstream_http_x_bot_signal_decision;
        auth_request_set $bot_signal_mode $upstream_http_x_bot_signal_mode;

        # Always overwrite client-supplied verdicts before proxying to the app.
        proxy_set_header X-Bot-Signal-Score $bot_signal_score;
        proxy_set_header X-Bot-Signal-Decision $bot_signal_decision;
        proxy_set_header X-Bot-Signal-Mode $bot_signal_mode;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_pass http://127.0.0.1:3000;
    }

    location = /_bot_signal {
        internal;
        auth_request off;
        proxy_pass http://127.0.0.1:3001/check;
        proxy_method GET;
        proxy_pass_request_body off;
        proxy_pass_request_headers off;
        proxy_set_header Content-Length "";
        proxy_set_header Host localhost;

        # $remote_addr is trustworthy only with correctly configured real-IP
        # handling when another proxy sits in front of Nginx.
        proxy_set_header X-Bot-Signal-Client-IP $remote_addr;
        proxy_set_header User-Agent $http_user_agent;
        proxy_set_header Accept-Language $http_accept_language;
        proxy_set_header Sec-CH-UA $http_sec_ch_ua;
        proxy_set_header Sec-CH-UA-Platform $http_sec_ch_ua_platform;
        proxy_set_header Sec-CH-UA-Mobile $http_sec_ch_ua_mobile;
        proxy_set_header Sec-Fetch-Site $http_sec_fetch_site;
        proxy_set_header Sec-Fetch-Mode $http_sec_fetch_mode;
        proxy_set_header Sec-Fetch-Dest $http_sec_fetch_dest;

        # Fail closed on service errors; do not add bypassing error handlers.
        proxy_cache off;
        proxy_connect_timeout 1s;
        proxy_send_timeout 3s;
        proxy_read_timeout 3s;
    }
}
