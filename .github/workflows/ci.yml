name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  playwright-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install chromium
      - name: Playwright browser and demo tests on Windows
        run: npm run test:playwright

  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit coverage
        run: npm run test:coverage

      - name: Install Patchright Chromium
        run: npx patchright install chromium

      - name: Patchright browser tests
        run: npm run test:patchright

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Playwright browser tests
        run: xvfb-run -a npm run test:playwright

      - name: Build
        run: npm run build

      - name: Install Nginx
        run: sudo apt-get update && sudo apt-get install -y nginx

      - name: Nginx gateway integration tests
        run: npm run test:nginx

      - name: Package lint
        run: npm run lint:package
